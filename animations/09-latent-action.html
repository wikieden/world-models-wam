<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>隐动作：用无标签视频的桥</title><link rel="stylesheet" href="anim.css"></head>
<body><main>
<h1>第 9 章 · 隐动作：用无标签视频的桥</h1>
<p class="sub">配套讲义：<a href="../lessons/09-latent-action.html">第 9 章 · 隐动作：用无标签视频的桥</a>。上：隐动作模型（LAM）怎么从前后两帧里挤出一个“发生了什么变化”；下：三个阶段怎么把它接到真实动作上。</p>
<div class="panel"><svg id="sv" viewBox="0 0 720 450"></svg></div>
<p id="cap" style="min-height:3.2em;margin:8px 4px"></p>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 重来</button></div>
<p class="note">看点：瓶颈越窄，隐动作越只能装“变化”，装不下“画面长什么样”。</p>
</main>
<script src="anim.js"></script>
<script>
function frame(g,x,y,dx){el('rect',{x,y,width:90,height:66,rx:6,fill:'var(--bg)',stroke:'var(--line)'},g);el('line',{x1:x+6,y1:y+54,x2:x+84,y2:y+54,stroke:'var(--muted)'},g);el('rect',{x:x+30+dx,y:y+32,width:22,height:22,rx:3,fill:'var(--accent)',opacity:.9},g)}
const g0=P(0);label(g0,'① 隐动作模型 LAM',16,24,{b:1});
const g1=P(1);frame(g1,16,44,0);label(g1,'o_t',61,128,{a:'middle',m:1});frame(g1,16,150,24);label(g1,'o_t+Δ',61,234,{a:'middle',m:1});
const g2=P(2);arrow(g2,110,110,150,140);arrow(g2,110,180,150,150);box(g2,152,116,100,58,'encoder','var(--teal)');
const g3=P(3);arrow(g3,254,145,290,145);el('path',{d:'M292 120 L340 136 L340 154 L292 170 Z',fill:'var(--purple)',opacity:.85},g3);
label(g3,'隐动作 ã',316,104,{a:'middle',c:'var(--purple)',b:1});label(g3,'8 选 1 ≈ 3 bit',316,192,{a:'middle',m:1,fs:12});
const g4=P(4);arrow(g4,342,145,382,145);box(g4,384,116,100,58,'decoder','var(--teal)');
el('path',{d:'M106 77 C 260 40, 380 60, 430 112',stroke:'var(--muted)',fill:'none','stroke-dasharray':'4 4'},g4);label(g4,'decoder 只拿 o_t 和 ã',260,56,{m:1,fs:12});
const g5=P(5);arrow(g5,486,145,520,145);frame(g5,524,112,24);label(g5,'重建的 o_t+Δ',569,196,{a:'middle',m:1});label(g5,'和真的比 → loss',569,214,{a:'middle',m:1,fs:12});
const g6=P(6);label(g6,'② 三个阶段',16,268,{b:1});
const ST=[['学隐动作','海量无标签视频 → LAM','var(--teal)'],['policy 预训练','VLM 看画面+指令 → 预测 ã','var(--purple)'],['后训练','少量真实动作：ã → 关节动作','var(--warm)']];
ST.forEach(([a,b,c],i)=>{const g=P(7+i);box(g,16+i*236,284,216,70,'','var(--line)',{fill:'var(--card)'});label(g,(i+1)+'. '+a,28+i*236,310,{b:1,c});label(g,b,28+i*236,336,{fs:12});if(i<2)arrow(g,234+i*236,319,250+i*236,319)});
const g10=P(10);el('rect',{x:16,y:372,width:688,height:62,rx:8,fill:'var(--accent-bg)',stroke:'var(--accent)'},g10);
label(g10,'推理：policy 出 ã → 动作头解码成真实动作。不生成视频，速度和 VLA 一样。',30,398,{fs:13});
label(g10,'LaWAM：Δt 机器人 1.6 s、人类 0.4 s；Genie 1：3 万小时游戏视频学出 8 个离散隐动作。',30,422,{fs:13,m:1});
runSteps([
  '问题：人类视频有上百万小时，但没有动作标签。能不能从视频里自己“反推”出动作？',
  '拿视频里相隔 Δ 的两帧：方块从左边到了右边。',
  'encoder 同时看两帧，输出一个隐动作 ã。',
  '关键：ã 被压得很窄（比如只能从 8 个里选 1 个），装不下整张画面。',
  'decoder 只能看第一帧 o_t 和 ã，要它画出第二帧。',
  '要画对，ã 就必须编码“发生了什么变化”（往右推了）。训练目标就是重建误差。',
  '有了隐动作，就能分三步把无标签视频接到真实机器人上。',
  '第 1 步：在海量无标签视频上训 LAM，每段视频都能打上隐动作。',
  '第 2 步：训 policy 去预测隐动作，人类视频全都能用。',
  '第 3 步：用少量带真实动作的数据，学从隐动作到关节动作的映射。',
  '部署时不生成视频，所以和 VLA 一样快。',
],1800);
</script>
